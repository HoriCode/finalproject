</head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" placeholder="password">
                </div>

                <div class="forgot-password">
                    <a href="#forgot">forgot password</a>
                </div>

                <div class="d-flex gap-3 mt-3">
    <button class="btn btn-success w-100 rounded-pill" onclick="handleLogin()">Log in</button>
    <button class="btn btn-dark w-100 rounded-pill" onclick="handleSignup()">Sign up</button>
</div>
            </div>
        </div>
    </div>
